function resizeGame() {
    const gameContainer = document.getElementById("gameContainer");
    if (!gameContainer) return;

    const dpr = Math.min(window.devicePixelRatio || 1, 2); // Cap at 2x for performance
    const targetAspectRatio = 400 / 600;
    
    let availableWidth = window.innerWidth * 0.95; 
    let availableHeight = window.innerHeight * 0.80; 
    
    if (availableWidth / availableHeight > targetAspectRatio) {
        availableWidth = availableHeight * targetAspectRatio;
    } else {
        availableHeight = availableWidth / targetAspectRatio;
    }
    
    // Internal canvas buffer resolution
    canvas.width = availableWidth * dpr;
    canvas.height = availableHeight * dpr;

    // Display layout dimensions
    gameContainer.style.width = `${availableWidth}px`;
    gameContainer.style.height = `${availableHeight}px`;

    // Scale drawing context to match DPR
    ctx.scale(dpr, dpr);
}

let resizeTimeout;
function debouncedResize() {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(resizeGame, 100);
}
window.addEventListener('resize', debouncedResize);
window.addEventListener('orientationchange', () => setTimeout(resizeGame, 200));
document.addEventListener('DOMContentLoaded', resizeGame);

function nonInspectCode() {
    // Disable right-click context menu
document.addEventListener('contextmenu', (e) => e.preventDefault());

// Block common Inspect Element keyboard shortcuts
document.addEventListener('keydown', (e) => {
    // Prevent F12
    if (e.key === 'F12') e.preventDefault();
    
    // Prevent Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C, Ctrl+U (View Source)
    if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) {
        e.preventDefault();
    }
    if (e.ctrlKey && e.key.toLowerCase() === 'u') {
        e.preventDefault();
    }
});
}

let currentLang = "en";

function t(key, replacements = {}) {
    let text = (TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang][key]) 
                ? TRANSLATIONS[currentLang][key] 
                : (TRANSLATIONS["en"][key] || "");
    if (typeof text === "string") {
        for (let r in replacements) {
            text = text.replace(`{${r}}`, replacements[r]);
        }
    }
    return text;
}

// Call this function and pass `true` when pressing gas, `false` when releasing
function playEngineSound() {
    if (!window.audioCtx) window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (window.audioCtx.state === 'suspended') window.audioCtx.resume();

    const ctx = window.audioCtx;
    const startTime = ctx.currentTime;
    const duration = 1.0; // Total 1 second

    // 1. Oscillators setup
    const osc1 = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    osc1.type = 'sawtooth';
    osc2.type = 'triangle';

    // 2. Dynamic lowpass filter
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';

    // 3. Master gain
    const gain = ctx.createGain();

    // Connections
    osc1.connect(filter);
    osc2.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);

    // 4. Volume Control Parameter
    const peakVolume = 0.015; // Reduced from 0.06 for a softer overall volume
    const fadeInEnd = startTime + 0.35; // Smooth 0.35s fade-in

    osc1.frequency.setValueAtTime(35, startTime);
    osc2.frequency.setValueAtTime(70, startTime);
    filter.frequency.setValueAtTime(150, startTime);
    gain.gain.setValueAtTime(0.0001, startTime); // Silent start

    // 5. SMOOTH FADE-IN
    gain.gain.linearRampToValueAtTime(peakVolume, fadeInEnd);
    osc1.frequency.exponentialRampToValueAtTime(160, fadeInEnd);
    osc2.frequency.exponentialRampToValueAtTime(320, fadeInEnd);
    filter.frequency.exponentialRampToValueAtTime(1400, fadeInEnd);

    // 6. FADE-OUT
    const fadeOutStart = startTime + 0.2;

    gain.gain.setValueAtTime(peakVolume, fadeOutStart);
    gain.gain.linearRampToValueAtTime(0.0001, startTime + duration);
    
    osc1.frequency.setValueAtTime(10, fadeOutStart);
    osc1.frequency.linearRampToValueAtTime(40, startTime + duration);
    
    osc2.frequency.setValueAtTime(320, fadeOutStart);
    osc2.frequency.linearRampToValueAtTime(80, startTime + duration);

    // 7. Start and schedule teardown at 1.0s
    osc1.start(startTime);
    osc2.start(startTime);

    osc1.stop(startTime + duration);
    osc2.stop(startTime + duration);

    // Clean up nodes after stopping
    setTimeout(() => {
        osc1.disconnect();
        osc2.disconnect();
        filter.disconnect();
        gain.disconnect();
    }, duration * 1000);
}

function playSoftBass(freq, duration = 0.25, gainVal = 0.018) {
    if (!audioCtx || isPaused || !isBgmOn || !freq) return;
    const osc = audioCtx.createOscillator();
    const filter = audioCtx.createBiquadFilter();
    const g = audioCtx.createGain();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(350, audioCtx.currentTime);

    g.gain.setValueAtTime(gainVal, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

    osc.connect(filter);
    filter.connect(g);
    g.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function playSoftPad(freq, duration = 0.6, gainVal = 0.005) {

function playSoftBeat(step) {
    if (!audioCtx || isPaused || !isBgmOn) return;
    
    if (step % 4 === 0) {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(75, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 0.08);

        g.gain.setValueAtTime(0.015, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.08);

        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    }

    if (step % 2 === 1) {
        const bufferSize = audioCtx.sampleRate * 0.02;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            output[i] = Math.random() * 2 - 1;
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(3500, audioCtx.currentTime);

        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0.004, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.02);

        noise.connect(filter);
        filter.connect(g);
        g.connect(audioCtx.destination);
        noise.start();
    }
}

    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const x = (clientX - rect.left) * scaleX;
    const y = (clientY - rect.top) * scaleY;

    //const rect = canvas.getBoundingClientRect();
    //const x = clientX - rect.left;
    //const y = clientY - rect.top;
    //const scaleX = canvas.width / rect.width;
    //const scaleY = canvas.height / rect.height;
    //const x = (clientX - rect.left) * scaleX;
    //const y = (clientY - rect.top) * scaleY;

    // AFTER (Fixed)
    if (gameState === "SPLASH") {
        gameState = "START";
        draw(); // Redraw immediately to render the START menu
        return;
    }

    if (isLangModalOpen) {
        for (let btn of langGrid) {
            if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
                currentLang = btn.code;
                updateFooterInstruction();
                playStarSound();
                return;
            }
        }
        if (x >= langCloseBtnBound.x && x <= langCloseBtnBound.x + langCloseBtnBound.w &&
            y >= langCloseBtnBound.y && y <= langCloseBtnBound.y + langCloseBtnBound.h) {
            isLangModalOpen = false;
            return;
        }
        return;
    }

    if (isSettingsOpen) {
        if (x >= modalBounds.sfx.x && x <= modalBounds.sfx.x + modalBounds.sfx.w &&
            y >= modalBounds.sfx.y && y <= modalBounds.sfx.y + modalBounds.sfx.h) {
            isSfxOn = !isSfxOn;
            return;
        }
        if (x >= modalBounds.bgm.x && x <= modalBounds.bgm.x + modalBounds.bgm.w &&
            y >= modalBounds.bgm.y && y <= modalBounds.bgm.y + modalBounds.bgm.h) {
            isBgmOn = !isBgmOn;
            if (isBgmOn && gameState === "PLAYING") startBGM();
            if (isBgmOn && (gameState === "START" || gameState === "CAR_SELECT")) startMenuBGM();
            if (!isBgmOn) stopAllAudio();
            return;
        }
        if (x >= modalBounds.close.x && x <= modalBounds.close.x + modalBounds.close.w &&
            y >= modalBounds.close.y && y <= modalBounds.close.y + modalBounds.close.h) {
            isSettingsOpen = false;
            if ((gameState === "START" || gameState === "CAR_SELECT") && isBgmOn) startMenuBGM();
            return;
        }
        return;
    }

    if (gameState === "START") {
        const distMusic = Math.hypot(x - playMusicBtnBounds.x, y - playMusicBtnBounds.y);
        if (distMusic <= playMusicBtnBounds.radius) {
            toggleStartMenuBgm();
            return;
        }

        if (x >= startRaceBtnBounds.x && x <= startRaceBtnBounds.x + startRaceBtnBounds.width &&
            y >= startRaceBtnBounds.y && y <= startRaceBtnBounds.y + startRaceBtnBounds.height) {
            gameState = "CAR_SELECT";
            return;
        }

        if (x >= startShareBtnBounds.x && x <= startShareBtnBounds.x + startShareBtnBounds.width &&
            y >= startShareBtnBounds.y && y <= startShareBtnBounds.y + startShareBtnBounds.height) {
            shareGame();
            return;
        }

        const distSettingsStart = Math.hypot(x - startSettingsBtnBounds.x, y - startSettingsBtnBounds.y);
        if (distSettingsStart <= startSettingsBtnBounds.radius) {
            settingsContext = "START";
            isSettingsOpen = true;
            return;
        }

        const distLang = Math.hypot(x - languageBtnBounds.x, y - languageBtnBounds.y);
        if (distLang <= languageBtnBounds.radius) {
            isLangModalOpen = true;
            return;
        }
        return;
    }

    if (gameState === "CAR_SELECT") {
        if (selectionAnimTimer > 0) return;

        for (let btn of carSelectBounds) {
            if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
                selectedColorIndex = btn.index;
                selectedCarForAnim = btn.index;
                selectionAnimTimer = 60;
                playStarSound();
                return;
            }
        }
        return;
    }

    if (gameState === "PLAYING") {
        const distSettings = Math.hypot(x - (inGameSettingsBtnBounds.x + 18), y - (inGameSettingsBtnBounds.y + 18));
        if (distSettings <= 18) {
            settingsContext = "INGAME";
            isSettingsOpen = true;
            return;
        }

        const distPause = Math.hypot(x - (pauseBtnBounds.x + 18), y - (pauseBtnBounds.y + 18));
        if (distPause <= 18) {
            togglePause();
            return;
        }
    }

    if (isPaused) return;

    if (gameState === "GAMEOVER") {
        if (
            x >= shareBtnBounds.x &&
            x <= shareBtnBounds.x + shareBtnBounds.width &&
            y >= shareBtnBounds.y &&
            y <= shareBtnBounds.y + shareBtnBounds.height
        ) {
            shareScore();
            return;
        }
        if (
            x >= tryAgainBtnBounds.x &&
            x <= tryAgainBtnBounds.x + tryAgainBtnBounds.width &&
            y >= tryAgainBtnBounds.y &&
            y <= tryAgainBtnBounds.y + tryAgainBtnBounds.height
        ) {
            selectRandomTrack();
            resetGame(true);
            stopAllAudio();
            gameState = "CAR_SELECT";
            if (isBgmOn) startMenuBGM();
            return;
        }
        if (
            x >= homeBtnBounds.x &&
            x <= homeBtnBounds.x + homeBtnBounds.width &&
            y >= homeBtnBounds.y &&
            y <= homeBtnBounds.y + homeBtnBounds.height
        ) {
            stopAllAudio();
            gameState = "START";
            if (isBgmOn) startMenuBGM();
            return;
        }
        return;
    } else if (gameState === "LEVEL_CLEAR") {
        startNextLevel();
        gameState = "PLAYING";
        if (isBgmOn) startBGM();
        return;
    }

    isTapping = true;
    playSoftAccelSound(); 
    updateEngineSound(true);
}

function handlePointerUp() {
    isTapping = false;
    updateEngineSound(false);
}

function togglePause() {
    if (gameState !== "PLAYING") return;
    isPaused = !isPaused;
    updateEngineSound(isTapping);
}

let isTouchActive = false;

canvas.addEventListener("mousedown", (e) => {
    if (isTouchActive) return; // Prevent double firing on iOS
    handlePointerDown(e.clientX, e.clientY);
});
canvas.addEventListener("mouseup", () => {
    if (isTouchActive) return;
    handlePointerUp();
});
canvas.addEventListener("touchstart", (e) => { 
    e.preventDefault(); 
    isTouchActive = true;
    if (e.touches.length > 0) {
        handlePointerDown(e.touches[0].clientX, e.touches[0].clientY); 
    }
}, { passive: false });
canvas.addEventListener("touchend", (e) => { 
    e.preventDefault(); 
    handlePointerUp();
    setTimeout(() => { isTouchActive = false; }, 300);
}, { passive: false });

window.addEventListener("keydown", (e) => {
    if (e.key === "p" || e.key === "P" || e.key === " ") {
        togglePause();
    }
});

            ctx.shadowBlur = 10;

            ctx.restore();
        }

        ctx.restore();
        return;
    } 

    ctx.fillStyle = "#18202c";

    ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
    ctx.setLineDash([20, 20]);
    ctx.beginPath();
    ctx.moveTo(0, (roadTop + roadBottom) / 2);
    ctx.lineTo(canvas.width, (roadTop + roadBottom) / 2);
    ctx.stroke();
    ctx.setLineDash([]);

    drawCheckeredBorders(ctx);

    if (finishLineX !== null) {
        drawFinishLine(ctx, finishLineX);
    }

    hazards.forEach(h => {
        drawCar(ctx, h.x, h.y, h.width, h.height, h.color, "#333333", h.color, false);
    });

    powerups.forEach(p => {
        if (p.type === "STAR") {
            const starGlow = (Math.floor(frameCount / 6) % 2 === 0) ? "#ffff00" : "#ffaa00";

        } else if (p.type === "HEART") {
            drawHeart(ctx, p.x, p.y - p.height / 2, p.width, p.height, "#ff3d94");

    });

    starExplosionParticles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });

    if (gameState === "PLAYING" || gameState === "LEVEL_CLEAR") {
        if (invulnerableTimer % 6 < 3) {
            ctx.save();
            if (isSpinning) {
                spinAngle += 0.3;
                ctx.translate(car.x, car.y);
                ctx.rotate(spinAngle);
                drawCar(
                    ctx, 0, 0, car.width, car.height, 
                    carColors[selectedColorIndex].color, 
                    carColors[selectedColorIndex].darkColor, 
                    carColors[selectedColorIndex].glow, 
                    true
                );
            } else {
                drawCar(
                    ctx, car.x, car.y, car.width, car.height, 
                    carColors[selectedColorIndex].color, 
                    carColors[selectedColorIndex].darkColor, 
                    carColors[selectedColorIndex].glow, 
                    true
                );
            }
            ctx.restore();
        }
    } else if (gameState === "CRASH_SEQUENCE") {
        explosionParticles.forEach(p => {
            if (p.life > 0) {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }

        wreckageDebris.forEach(d => {
            ctx.save();
            ctx.translate(d.x, d.y);
            ctx.rotate(d.rot);
            ctx.fillStyle = d.color;
            ctx.fillRect(-d.size/2, -d.size/2, d.size, d.size);
            ctx.restore();
        });
    }

    if (gameState === "LEVEL_CLEAR") {
        

        celebrationRings.forEach(r => {
            if (r.alpha > 0) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                ctx.strokeStyle = r.color;
                ctx.globalAlpha = r.alpha;
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.restore();
            }
        });

        celebrationParticles.forEach(p => {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 6;

            if (p.shape === "RECT") {
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 1.5);
            } else if (p.shape === "STAR") {
                drawStar(ctx, 0, 0, 5, p.size, p.size / 2, p.color, null);
            } else {
                ctx.beginPath();
                ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
                ctx.fill();

            ctx.restore();

        ctx.fillStyle = "rgba(10, 15, 25, 0.4)";

        ctx.fill();
        ctx.stroke();

        ctx.roundRect(tryAgainBtnBounds.x, tryAgainBtnBounds.y, tryAgainBtnBounds.width, tryAgainBtnBounds.height, 6);

        ctx.fillStyle = "#0d111a";
        ctx.font = "bold 13px 'Courier New'";
        ctx.fillText(t("tryAgain"), tryAgainBtnBounds.x + tryAgainBtnBounds.width / 2, tryAgainBtnBounds.y + 22);

        ctx.fillText("PAUSED", canvas.width / 2, canvas.height / 2);

    drawModals();

}

function drawNASCARChevrons(ctx, y, height) {
    const width = 30;
    const num = Math.ceil(canvas.width / width) + 2;
    const offsetX = (frameCount * baseSpeed * 1.2) % width;
    ctx.fillStyle = currentRoadTheme.light;
    ctx.fillRect(0, y, canvas.width, height);
    ctx.fillStyle = currentRoadTheme.dark;
    for (let i = -1; i < num; i++) {
        const x = (i * width) - offsetX;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + width / 2, y + height / 2);
        ctx.lineTo(x + width, y + height);
        ctx.lineTo(x + width / 4, y + height);
        ctx.lineTo(x + width * 0.75, y + height / 2);
        ctx.lineTo(x + width / 4, y);
        ctx.closePath();
        ctx.fill();
    }
}

        ctx.lineTo(x + width, y);
        ctx.lineTo(x + width - 10, y + height);

}

// Lightweight path builder helper (prevents context overhead)

function appendHexPath(ctx, x, y, hexWidth, height) {
    ctx.moveTo(x + hexWidth * 0.25, y);
    ctx.lineTo(x + hexWidth * 0.75, y);
    ctx.lineTo(x + hexWidth, y + height / 2);
    ctx.lineTo(x + hexWidth * 0.75, y + height);
    ctx.lineTo(x + hexWidth * 0.25, y + height);
    ctx.lineTo(x, y + height / 2);
    ctx.closePath();
}

// Pattern 6: Rounded Formula 1 Apex Curbing
function drawF1Curb(ctx, y, height) {
    const width = 35;
    const num = Math.ceil(canvas.width / width) + 2;
    const offsetX = (frameCount * baseSpeed * 1.4) % (width * 2);

    for (let i = -1; i < num; i++) {
        const x = (i * width) - offsetX;
        const isDark = i % 2 === 0;

        ctx.fillStyle = isDark ? currentRoadTheme.dark : currentRoadTheme.light;
        
        // Render angled pill-style curb blocks
        ctx.beginPath();
        ctx.roundRect(x, y + 2, width - 4, height - 4, 4);
        ctx.fill();

        // High-gloss top reflection edge
        ctx.fillStyle = currentRoadTheme.accent;
        ctx.fillRect(x + 2, y + 2, width - 8, 3);
    }
}

// Pattern 7: Drifting Asphalt & Burnout Marks
function drawSkidMarks(ctx, y, height) {
    const width = 80;
    const num = Math.ceil(canvas.width / width) + 2;
    const offsetX = (frameCount * baseSpeed * 1.5) % width;

    // Dark asphalt base border
    ctx.fillStyle = currentRoadTheme.light;
    ctx.fillRect(0, y, canvas.width, height);

    for (let i = -1; i < num; i++) {
        const x = (i * width) - offsetX;
        
        // Burnout streaks
        ctx.strokeStyle = currentRoadTheme.dark;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x, y + 4);
        ctx.bezierCurveTo(x + 20, y + height, x + 40, y, x + width, y + height - 4);
        ctx.stroke();

        ctx.strokeStyle = currentRoadTheme.accent;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x + 10, y + height - 4);
        ctx.lineTo(x + width - 10, y + 4);
        ctx.stroke();
    }
}

// Pattern 8: Tron-Style Glowing Cyber Grid
function drawCyberGrid(ctx, y, height) {
    const blockWidth = 20;
    const patternCycle = blockWidth * 3; // 60px repeat cycle for nodes
    const num = Math.ceil(canvas.width / blockWidth) + 4;
    const offsetX = (frameCount * baseSpeed * 1.2) % patternCycle;

    // Dark background base
    ctx.fillStyle = currentRoadTheme.light;
    ctx.fillRect(0, y, canvas.width, height);

    // Center horizontal grid line
    ctx.strokeStyle = currentRoadTheme.dark;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, y + height / 2);
    ctx.lineTo(canvas.width, y + height / 2);
    ctx.stroke();

    // Vertical grid cells + glowing nodes
    for (let i = -2; i < num; i++) {
        const x = (i * blockWidth) - offsetX;

        ctx.strokeStyle = currentRoadTheme.dark;
        ctx.strokeRect(x, y, blockWidth, height);

        // Glowing center node locked to 60px grid interval
        if ((i % 3 + 3) % 3 === 0) {
            ctx.fillStyle = currentRoadTheme.accent;
            ctx.fillRect(x + 6, y + (height / 2) - 1.5, 8, 3);
        }
    }
}

function drawCheckeredBorders(ctx) {
    ctx.save();
    
    // Completely disable shadow blur on border patterns to eliminate render lag
    ctx.shadowColor = "transparent";
    ctx.shadowBlur = 0;
    
    // Disable heavy shadows for complex vector patterns to prevent lag
    const lagHeavyPatterns = ["hexagons", "cybergrid", "skidmarks"];
    if (!lagHeavyPatterns.includes(currentPatternStyle)) {
        ctx.shadowColor = currentRoadTheme.dark;
        ctx.shadowBlur = 6;
    }

    const yBounds = [
        { top: roadTop - 20, height: 20 },
        { top: roadBottom, height: 20 }
    ];

    yBounds.forEach(bound => {
        switch (currentPatternStyle) {
            case "chevrons": drawNASCARChevrons(ctx, bound.top, bound.height); break;
            case "slashes": drawSpeedSlashes(ctx, bound.top, bound.height); break;
            case "stripes": drawRacingStripes(ctx, bound.top, bound.height); break;
            case "hexagons": drawHexagonsHighPerf(ctx, bound.top, bound.height); break;
            case "f1curb": drawF1Curb(ctx, bound.top, bound.height); break;
            case "skidmarks": drawSkidMarks(ctx, bound.top, bound.height); break;
            case "cybergrid": drawCyberGrid(ctx, bound.top, bound.height); break;
            case "tsunamiCrests": drawTsunamiCrests(ctx, bound.top, bound.height); break;
            case "sineWaves": drawSineWaves(ctx, bound.top, bound.height); break;
            case "curledCrest": drawCurledCrest(ctx, bound.top, bound.height); break;
            case "gentleSwells": drawGentleSwells(ctx, bound.top, bound.height); break;
            case "sharkFins": drawSharkFins(ctx, bound.top, bound.height); break;
            case "doubleRibbon": drawDoubleRibbon(ctx, bound.top, bound.height); break;
            case "dunePeaks": drawDunePeaks(ctx, bound.top, bound.height); break;
            case "choppyWaters": drawChoppyWaters(ctx, bound.top, bound.height); break;
            case "layeredSurge": drawLayeredSurge(ctx, bound.top, bound.height); break;
            case "scallopedEdge": drawScallopedEdge(ctx, bound.top, bound.height); break;
            case "pointedBreakers": drawPointedBreakers(ctx, bound.top, bound.height); break;
            case "fluidRibbon": drawFluidRibbon(ctx, bound.top, bound.height); break;
            case "tripleParallelSine": drawTripleParallelSine(ctx, bound.top, bound.height); break;
            //case "wavyQuadLayer": drawWavyQuadLayer(ctx, bound.top, bound.height); break;
            case "featheredStream": drawFeatheredStream(ctx, bound.top, bound.height); break;
            case "curvedBarrel": drawCurvedBarrel(ctx, bound.top, bound.height); break;
            case "classicCrest": drawClassicCrest(ctx, bound.top, bound.height); break;
            case "spiralCurl": drawSpiralCurl(ctx, bound.top, bound.height); break;
            case "broadBreakers": drawBroadBreakers(ctx, bound.top, bound.height); break;
            case "overlappingSwells": drawOverlappingSwells(ctx, bound.top, bound.height); break;
            case "wavyQuadLayer": drawWavyQuadLayer(ctx, bound.top, bound.height); break;
            case "cybergrid":
            default:
            drawCyberGrid(ctx, bound.top, bound.height);
            break;
            //default: drawClassicCheckers(ctx, bound.top, bound.height); break;
        }
    });

    ctx.restore();
}

// 1. Triple Parallel Sine (image_3db390)
function drawTripleParallelSine(ctx, y, height) {
    const w = 36;
    const offsetX = (frameCount * baseSpeed * 0.95) % w;
    const num = Math.ceil(canvas.width / w) + 2;

    ctx.fillStyle = currentRoadTheme.light;
    ctx.fillRect(0, y, canvas.width, height);

    ctx.strokeStyle = currentRoadTheme.dark;
    ctx.lineWidth = 3.5;
    ctx.lineCap = "round";

    const offsetsY = [height * 0.25, height * 0.5, height * 0.75];
    
    offsetsY.forEach(yOffset => {
        ctx.beginPath();
        for (let i = -1; i < num; i++) {
            const x = (i * w) - offsetX;
            ctx.moveTo(x, y + yOffset);
            ctx.quadraticCurveTo(x + w / 4, y + yOffset - 4, x + w / 2, y + yOffset);
            ctx.quadraticCurveTo(x + (3 * w) / 4, y + yOffset + 4, x + w, y + yOffset);
        }
        ctx.stroke();
    });
}

// 2. Wavy Quad Layer (image_3db3a9)
function drawWavyQuadLayer(ctx, y, height) {
    const w = 30;
    const offsetX = (frameCount * baseSpeed * 1.0) % w;

    ctx.fillRect(0, y, canvas.width, height);

    ctx.strokeStyle = currentRoadTheme.accent;
    ctx.lineWidth = 2.5;

    const layers = 4;
    for (let l = 0; l < layers; l++) {
        const yPos = y + (height / (layers + 1)) * (l + 1);
        ctx.beginPath();
        for (let i = -1; i < num; i++) {
            const x = (i * w) - offsetX;
            ctx.moveTo(x, yPos);
            ctx.quadraticCurveTo(x + w / 4, yPos - 3, x + w / 2, yPos);
            ctx.quadraticCurveTo(x + (3 * w) / 4, yPos + 3, x + w, yPos);
        }
        ctx.stroke();
    }

function drawVerticalCapsuleMinimap(ctx) {
    ctx.save();
    const x = 330;
    const y = 12;
    const w = 55;
    const h = 75;
    const r = w / 2;

    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fillStyle = "rgba(10, 15, 25, 0.9)";
    ctx.fill();
    ctx.strokeStyle = "#80ffe5";
    ctx.lineWidth = 4;
    ctx.stroke();

    const levelDistance = distanceTraveled - levelStartDistance;
    const progress = Math.min(1, Math.max(0, levelDistance / trackLength));

    ctx.fillStyle = "#80ffe5";
    ctx.font = "bold 18px 'Courier New'";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(`${Math.floor(progress * 100)}%`, x + w / 2, y + h / 2);

    const straightLen = h - 2 * r;
    const arcLen = Math.PI * r;
    const totalPerimeter = (2 * straightLen) + (2 * arcLen);

    const currentDist = progress * totalPerimeter;

    let dotX = x + w / 2;
    let dotY = y;

    if (currentDist <= arcLen / 2) {
        const angle = -Math.PI / 2 + (currentDist / (arcLen / 2)) * (Math.PI / 2);
        dotX = (x + r) + r * Math.cos(angle);
        dotY = (y + r) + r * Math.sin(angle);
    } else if (currentDist <= (arcLen / 2) + straightLen) {
        const d = currentDist - (arcLen / 2);
        dotX = x + w;
        dotY = (y + r) + d;
    } else if (currentDist <= (1.5 * arcLen) + straightLen) {
        const d = currentDist - ((arcLen / 2) + straightLen);
        const angle = (d / arcLen) * Math.PI;
        dotX = (x + r) + r * Math.cos(angle);
        dotY = (y + h - r) + r * Math.sin(angle);
    } else if (currentDist <= (1.5 * arcLen) + (2 * straightLen)) {
        const d = currentDist - ((1.5 * arcLen) + straightLen);
        dotX = x;
        dotY = (y + h - r) - d;
    } else {
        const d = currentDist - ((1.5 * arcLen) + (2 * straightLen));
        const angle = Math.PI + (d / (arcLen / 2)) * (Math.PI / 2);
        dotX = (x + r) + r * Math.cos(angle);
        dotY = (y + r) + r * Math.sin(angle);
    }

    const playerCarColor = carColors[selectedColorIndex].color;
    ctx.beginPath();
    ctx.arc(dotX, dotY, 6, 0, Math.PI * 2);
    ctx.fillStyle = playerCarColor;
    ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.restore();
}

function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius, color, shadowColor) {
    let rot = Math.PI / 2 * 3;
    let x = cx, y = cy;
    let step = Math.PI / spikes;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx, cy - outerRadius);
    for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;

        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
    }
    ctx.lineTo(cx, cy - outerRadius);
    ctx.closePath();

    ctx.fillStyle = color;
    ctx.shadowColor = shadowColor;
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.restore();
}

function drawHeart(ctx, x, y, width, height) {
    ctx.save();
    ctx.beginPath();
    let topCurveHeight = height * 0.3;
    ctx.moveTo(x + width / 2, y + topCurveHeight);
    ctx.bezierCurveTo(x + width / 2, y, x, y, x, y + topCurveHeight);
    ctx.bezierCurveTo(x, y + (height + topCurveHeight) / 2, x + width / 2, y + height, x + width / 2, y + height);
    ctx.bezierCurveTo(x + width / 2, y + height, x + width, y + height, x + width, y + topCurveHeight);
    ctx.bezierCurveTo(x + width, y, x + width / 2, y, x + width / 2, y + topCurveHeight);
    ctx.closePath();

    ctx.shadowColor = "#ff3399"; 
    ctx.shadowBlur = 10;
    ctx.fillStyle = "#ff2a8d"; 
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x + width * 0.3, y + height * 0.3, width * 0.15, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
    ctx.shadowColor = "#ffffff";
    ctx.shadowBlur = 4;
    ctx.fill();

    ctx.restore();
}

function drawObstacleCar(ctx, x, y, w, h, color) {
    ctx.save();

    const isAtTopBoundary = (y <= roadTop + 1);
    const isAtBottomBoundary = (y + h >= roadBottom - 1);

    ctx.fillStyle = "#111116";
    if (!isAtTopBoundary) {
        ctx.fillRect(x + 5, y - 2, 8, 3);
        ctx.fillRect(x + w - 13, y - 2, 8, 3);
    }
    if (!isAtBottomBoundary) {
        ctx.fillRect(x + 5, y + h - 1, 8, 3);
        ctx.fillRect(x + w - 13, y + h - 1, 8, 3);
    }

    ctx.beginPath();
    ctx.moveTo(x, y + h * 0.3);
    ctx.quadraticCurveTo(x, y, x + 8, y);
    ctx.lineTo(x + w - 6, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + 6);
    ctx.lineTo(x + w, y + h - 6);
    ctx.quadraticCurveTo(x + w, y + h, x + w - 6, y + h);
    ctx.lineTo(x + 8, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h * 0.7);
    ctx.closePath();

    ctx.fillStyle = color;
    ctx.fill();

    ctx.fillStyle = "#1c2b36";
    ctx.beginPath();
    ctx.moveTo(x + 14, y + 3);
    ctx.lineTo(x + 20, y + 3);
    ctx.lineTo(x + 24, y + h * 0.2);
    ctx.lineTo(x + w - 10, y + h * 0.2);
    ctx.lineTo(x + w - 8, y + h * 0.8);
    ctx.lineTo(x + 24, y + h * 0.8);
    ctx.lineTo(x + 20, y + h - 3);
    ctx.lineTo(x + 14, y + h - 3);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = color;
    ctx.fillRect(x + w - 24, y + 4, 12, h - 8);

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x, y + 2, 2, 4);
    ctx.fillRect(x, y + h - 6, 2, 4);

    ctx.fillStyle = "#ff3333";
    ctx.fillRect(x + w - 2, y + 3, 2, 4);
    ctx.fillRect(x + w - 2, y + h - 7, 2, 4);

    ctx.restore();
}

function drawPlayerCar(ctx, w, h, overrideColor, colorIndex = selectedColorIndex) {
    ctx.save();
    
    const activeColorObj = carColors[colorIndex];
    const mainColor = overrideColor || activeColorObj.color;
    const darkColor = activeColorObj.darkColor;

    const isAtTopBoundary = (car.y - h / 2 <= roadTop + 1);
    const isAtBottomBoundary = (car.y + h / 2 >= roadBottom - 1);

    let topBeamGrad = ctx.createRadialGradient(w/2 - 3, -h/2 + 3, 0, w/2 - 3, -h/2 + 3, 14);
    topBeamGrad.addColorStop(0, "rgba(255, 140, 20, 0.4)");
    topBeamGrad.addColorStop(0.5, "rgba(255, 120, 0, 0.2)");
    topBeamGrad.addColorStop(1, "rgba(255, 100, 0, 0)");

    ctx.fillStyle = topBeamGrad;
    ctx.beginPath();
    ctx.arc(w/2 - 3, -h/2 + 3, 14, -Math.PI / 3, Math.PI / 3, false);
    ctx.closePath();
    ctx.fill();

    let botBeamGrad = ctx.createRadialGradient(w/2 - 3, h/2 - 5, 0, w/2 - 3, h/2 - 5, 14);
    botBeamGrad.addColorStop(0, "rgba(255, 140, 20, 0.4)");
    botBeamGrad.addColorStop(0.5, "rgba(255, 120, 0, 0.2)");
    botBeamGrad.addColorStop(1, "rgba(255, 100, 0, 0)");

    ctx.fillStyle = botBeamGrad;
    ctx.beginPath();
    ctx.arc(w/2 - 3, h/2 - 5, 14, -Math.PI / 3, Math.PI / 3, false);
    ctx.closePath();
    ctx.fill();

    // 1. Set 50% transparency if invulnerable
    if (invulnerableTimer > 0) {
        if (starPowerTimer > 0 || starWarningTimer > 0) {
            ctx.globalAlpha = 1.0; // 0% transparency (fully visible) if you have star power
        } else {
            ctx.globalAlpha = 0.5; // Normal 50% transparency when hit without star
        }
    }

    ctx.fillStyle = "#0c0d12";
    if (!isAtTopBoundary) {
        ctx.fillRect(-w/2 + 6, -h/2 - 3, 10, 4);
        ctx.fillRect(w/2 - 16, -h/2 - 3, 10, 4);
    }
    if (!isAtBottomBoundary) {
        ctx.fillRect(-w/2 + 6, h/2 - 1, 10, 4);
        ctx.fillRect(w/2 - 16, h/2 - 1, 10, 4);
    }

    ctx.beginPath();
    ctx.moveTo(w/2, -h*0.2);
    ctx.quadraticCurveTo(w/2, -h/2, w/2 - 8, -h/2);
    ctx.lineTo(-w/2 + 6, -h/2);
    ctx.quadraticCurveTo(-w/2, -h/2, -w/2, -h/2 + 5);
    ctx.lineTo(-w/2, h/2 - 5);
    ctx.quadraticCurveTo(-w/2, h/2, -w/2 + 6, h/2);
    ctx.lineTo(w/2 - 8, h/2);
    ctx.quadraticCurveTo(w/2, h/2, w/2, h*0.2);
    ctx.closePath();

    const bodyGrad = ctx.createLinearGradient(-w/2, -h/2, -w/2, h/2);
    bodyGrad.addColorStop(0, mainColor);
    bodyGrad.addColorStop(1, mainColor);

    ctx.fillStyle = bodyGrad;
    ctx.fill();

    ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
    ctx.fillRect(-w/2 + 2, -3, w - 4, 1.8);
    ctx.fillRect(-w/2 + 2, 1.2, w - 4, 1.8);

    ctx.fillStyle = "#16202c";
    ctx.beginPath();
    ctx.ellipse(0, 0, 8, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = "#111620";
    ctx.fillRect(-w/2 - 1, -h/2 + 3, 4, h - 6);

    ctx.fillStyle = "#ffffaa";
    ctx.fillRect(w/2 - 3, -h/2 + 3, 3, 4);
    ctx.fillRect(w/2 - 3, h/2 - 7, 3, 4);

    ctx.restore();
}

function drawSettingsIconButton(ctx, cx, cy, r, fillColor = "#00c4a6", strokeColor = "#00d2b4") {
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = fillColor;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(cx, cy, r - 2, 0, Math.PI * 2);
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = "#ffffff";

    const teeth = 8;
    const outerRadius = r * 0.55;
    const innerRadius = r * 0.4;

    ctx.beginPath();
    for (let i = 0; i < teeth; i++) {
        let angle = (i * Math.PI * 2) / teeth;
        let angleNext = ((i + 0.5) * Math.PI * 2) / teeth;

        let x1 = Math.cos(angle) * outerRadius;
        let y1 = Math.sin(angle) * outerRadius;
        let x2 = Math.cos(angleNext) * innerRadius;
        let y2 = Math.sin(angleNext) * innerRadius;

        if (i === 0) ctx.moveTo(x1, y1);
        else ctx.lineTo(x1, y1);

        ctx.lineTo(x2, y2);
    }
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, 0, r * 0.22, 0, Math.PI * 2);
    ctx.fillStyle = fillColor;
    ctx.fill();

    ctx.restore();
    ctx.restore();
}

function drawGlobeIconButton(ctx, cx, cy, r) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = "#5ca5f5";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(cx, cy, r - 2, 0, Math.PI * 2);
    ctx.strokeStyle = "#3b82d6";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.8;

    ctx.beginPath();
    ctx.arc(0, 0, r * 0.5, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-r * 0.5, 0);
    ctx.lineTo(r * 0.5, 0);
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(0, 0, r * 0.22, r * 0.5, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();
    ctx.restore();
}

function update() {
    frameCount++;

    if (gameState === "CRASH_SEQUENCE") {
        crashSequenceTimer--;
        
        screenShake.x = (Math.random() - 0.5) * Math.min(crashSequenceTimer / 5, 18);
        screenShake.y = (Math.random() - 0.5) * Math.min(crashSequenceTimer / 5, 18);

        for (let p of explosionParticles) {
            p.x += p.vx;
            p.y += p.vy;
            p.size *= 0.96;
            p.life -= 1;
        }

        for (let d of wreckageDebris) {
            d.x += d.vx;
            d.y += d.vy;
            d.rot += d.vRot;
        }

        if (crashSequenceTimer <= 0) {
            screenShake = { x: 0, y: 0 };
            gameState = "GAMEOVER";
            triggerGameOverAudio();
        }
        return;
    }

    if (gameState === "CAR_SELECT") {
        if (selectionAnimTimer > 0) {
            selectionAnimTimer--;
            if (selectionAnimTimer === 0) {
                selectRandomTrack();
                resetGame(true);
                gameState = "PLAYING";
                if (isBgmOn) startBGM();
            }
        }
        return;
    }

    if (gameState !== "PLAYING" || isPaused || isSettingsOpen || isLangModalOpen) return;

    updateEngineSound(isTapping);
    
    if (showOneUpTextTimer > 0) showOneUpTextTimer--;

    if (starPowerTimer > 0) {
        starPowerTimer--;
        car.width = car.baseWidth * 1.25;  
        car.height = car.baseHeight * 1.25;
        if (starPowerTimer === 0) {
            starWarningTimer = 120;
        }
    } else if (starWarningTimer > 0) {
        starWarningTimer--;
        if (starWarningTimer === 0) {
            car.width = car.baseWidth;
            car.height = car.baseHeight;
            starHitsCounter = 0; 
        }
    }

    if (invulnerableTimer > 0) {
        invulnerableTimer--;
        realSpeedMPH = 70; 
        spinAngle += 0.25;      
        if (invulnerableTimer === 0) isSpinning = false;
    } else {
        realSpeedMPH = Math.min(maxRealSpeedMPH, 80 + (distanceTraveled / 120));
    }

    const currentMaxDisplayMPH = 200 + (currentLevel - 1) * 5;
    displaySpeedMPH = (realSpeedMPH / maxRealSpeedMPH) * currentMaxDisplayMPH;

    baseSpeed = realSpeedMPH / 15;
    distanceTraveled += (baseSpeed * 0.5);

    if (Math.floor(distanceTraveled) > bestDistance) {
        bestDistance = Math.floor(distanceTraveled);
        localStorage.setItem("rush_traffic_best", bestDistance);
    }

    const levelDistance = distanceTraveled - levelStartDistance;
    if (levelDistance >= trackLength - 300 && finishLineX === null) {
        finishLineX = canvas.width + 100;
    }

    if (finishLineX !== null) {
        finishLineX -= baseSpeed;
        if (car.x >= finishLineX && levelClearTimer === 0) {
            levelClearTimer = 180; 
            playVictorySound();
            startCelebrationSequence();
        }
    }

    if (levelClearTimer > 0) {
        levelClearTimer--;

        for (let p of celebrationParticles) {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += p.gravity;
            p.rot += p.vRot;
            p.life -= 1;
        }

        for (let r of celebrationRings) {
            if (r.radius < r.maxRadius) {
                r.radius += r.speed;
                r.alpha = Math.max(0, 1 - (r.radius / r.maxRadius));
            }
        }

        if (levelClearTimer === 0) {
            gameState = "LEVEL_CLEAR";
        }
    }

    if (isTapping) {
        car.vy += car.downImpulse;
    } else {
        car.vy += car.defaultUpDrift;
    }

    car.vy *= 0.88;
    car.y += car.vy;

    if (car.y - car.height / 2 < roadTop) {
        car.y = roadTop + car.height / 2;
        car.vy = 0;
    }
    if (car.y + car.height / 2 > roadBottom) {
        car.y = roadBottom - car.height / 2;
        car.vy = 0;
    }

    if (frameCount % Math.max(8, 16 - currentLevel * 2) === 0) {
        spawnHazard();
    }
    if (frameCount % 420 === 0) {
        spawnPowerup();
    }

    for (let i = powerups.length - 1; i >= 0; i--) {
        let p = powerups[i];
        p.x -= (baseSpeed + p.speedOffset);

        if (car.x - car.width/2 < p.x + p.width/2 &&
            car.x + car.width/2 > p.x - p.width/2 &&
            car.y - car.height/2 < p.y + p.height/2 &&
            car.y + car.height/2 > p.y - p.height/2) {

            if (p.type === "STAR") {
                playStarSound();
                starPowerTimer = 300;
                starWarningTimer = 0;
                starHitsCounter = 0;
            } else if (p.type === "HEART") {
                triggerEarnedLife(p.x, p.y);
            }
            powerups.splice(i, 1);
            continue;
        }

        if (p.x < -60) powerups.splice(i, 1);
    }

    for (let i = hazards.length - 1; i >= 0; i--) {
        let h = hazards[i];
        h.x -= (baseSpeed + h.speedOffset);

        if (car.x - car.width/2 < h.x + h.width &&
            car.x + car.width/2 > h.x &&
            car.y - car.height/2 < h.y + h.height &&
            car.y + car.height/2 > h.y) {

            if (starPowerTimer > 0 || starWarningTimer > 0) {
                playStarBumpSound();
                
                // --- SPAWN SPARKLING STAR EXPLOSION ---
                for (let s = 0; s < 7; s++) { 
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 6 + 2; // Slightly softer burst speed
                    starExplosionParticles.push({
                        x: h.x + h.width / 2,
                        y: h.y + h.height / 2,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        spikes: 5,
                        outerRadius: Math.random() * 6 + 2,
                        innerRadius: Math.random() * 3 + 1,
                        color: celebrationColors[Math.floor(Math.random() * celebrationColors.length)],
                        shadowColor: "#ffffff",
                        life: Math.random() * 20 + 15
                    });
                }

                hazards.splice(i, 1);
                starHitsCounter++;
                if (starHitsCounter % 5 === 0 && lives < maxLives) {
                    triggerEarnedLife(h.x, h.y);
                }
                continue;
            }

            if (invulnerableTimer === 0) {
                triggerCrash();
                hazards.splice(i, 1);
                continue;
            }
        }

        if (h.x < -60) hazards.splice(i, 1);
    }
}

function drawCrashSequence(ctx) {
    if (crashSequenceTimer > 165) {
        ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
        ctx.fillRect(-20, -20, canvas.width + 40, canvas.height + 40);
    }

    const progress = (180 - crashSequenceTimer) / 180;
    const waveRadius = progress * 240;
    ctx.save();
    ctx.beginPath();
    ctx.arc(car.x, car.y, waveRadius, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255, 61, 148, ${1 - progress})`;
    ctx.lineWidth = 8;
    ctx.stroke();
    ctx.restore();

    for (let p of explosionParticles) {
        if (p.life > 0 && p.size > 0.5) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.restore();
        }
    }

    for (let d of wreckageDebris) {
        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.rotate(d.rot);
        ctx.fillStyle = d.color;
        ctx.fillRect(-d.size / 2, -d.size / 2, d.size, d.size / 2);
        ctx.fillStyle = "#111116";
        ctx.fillRect(-d.size / 4, -d.size / 4, d.size / 2, d.size / 4);
        ctx.restore();
    }

    ctx.save();
    ctx.fillStyle = "#ff0055";
    ctx.font = "bold 30px 'Courier New'";
    ctx.textAlign = "center";
    ctx.shadowColor = "#ffea00";
    ctx.shadowBlur = 15;
    ctx.fillText(t("crashed"), canvas.width / 2, canvas.height / 2 - 20);
    ctx.restore();
}

function drawCelebrationSequence(ctx) {
    for (let r of celebrationRings) {
        if (r.alpha > 0) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
            ctx.strokeStyle = r.color;
            ctx.globalAlpha = r.alpha;
            ctx.lineWidth = Math.min(6, 1 + currentLevel * 0.8);
            ctx.shadowColor = r.color;
            ctx.shadowBlur = 12;
            ctx.stroke();
            ctx.restore();
        }
    }

    for (let p of celebrationParticles) {
        if (p.life > 0) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 8;

            if (p.shape === "STAR") {
                drawStar(ctx, 0, 0, 5, p.size, p.size / 2, p.color, p.color);
            } else if (p.shape === "RECT") {
                ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
            } else {
                ctx.beginPath();
                ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }
    }

    ctx.save();
    const textPulse = Math.sin(frameCount * 0.15) * 4;
    ctx.fillStyle = celebrationColors[Math.floor(frameCount / 4) % celebrationColors.length];
    ctx.font = `bold ${24 + textPulse}px 'Courier New'`;
    ctx.textAlign = "center";
    ctx.shadowColor = "#ffffff";
    ctx.shadowBlur = 16;
    ctx.fillText(`🏆 ${praiseText} 🏆`, canvas.width / 2, canvas.height / 2 - 40);
    ctx.restore();
}

function drawModernActionBtn(btnBounds, label, primaryColor, strokeColor) {
    ctx.save();
    ctx.shadowColor = primaryColor;
    ctx.shadowBlur = 8;

    ctx.fillStyle = "rgba(18, 26, 40, 0.9)";
    ctx.beginPath();
    ctx.roundRect(btnBounds.x, btnBounds.y, btnBounds.width, btnBounds.height, 10);
    ctx.fill();

    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.fillStyle = strokeColor;
    ctx.font = "bold 12px 'Courier New'";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(label, btnBounds.x + btnBounds.width / 2, btnBounds.y + btnBounds.height / 2 + 1);
    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    if (gameState === "CRASH_SEQUENCE") {
        ctx.translate(screenShake.x, screenShake.y);
    }

    ctx.fillStyle = "#404a5c";
    ctx.fillRect(0, roadTop, canvas.width, roadBottom - roadTop);

    ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
    ctx.lineWidth = 2;
    ctx.setLineDash([20, 20]);
    const lineOffset = (frameCount * baseSpeed) % 40;

    for (let i = 1; i <= 3; i++) {
        let y = roadTop + ((roadBottom - roadTop) / 4) * i;
        ctx.beginPath();
        ctx.moveTo(-lineOffset, y);
        ctx.lineTo(canvas.width + 40, y);
        ctx.stroke();
    }
    ctx.setLineDash([]);

    drawCheckeredBorders(ctx);

    if (finishLineX !== null) {
        drawFinishLine(ctx, finishLineX);
    }

    for (let p of powerups) {
        if (p.type === "STAR") {
            drawStar(ctx, p.x, p.y, 5, 14, 7, "#ffff33", "#ffff99");
        } else {
            drawHeart(ctx, p.x - p.width/2, p.y - p.height/2, p.width, p.height);
        }
    }

    for (let h of hazards) {
        drawObstacleCar(ctx, h.x, h.y, h.width, h.height, h.color);
    }

    // --- DRAW STAR EXPLOSION PARTICLES ---
    for (let i = starExplosionParticles.length - 1; i >= 0; i--) {
        let p = starExplosionParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vRot;
        p.life--;

        ctx.save();
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        drawStar(ctx, 0, 0, p.spikes, p.outerRadius, p.innerRadius, p.color, p.color);
        ctx.restore();

        if (p.life <= 0) {
            starExplosionParticles.splice(i, 1);
        }
    }

    if (gameState === "PLAYING" || gameState === "LEVEL_CLEAR") {
        ctx.save();
        ctx.translate(car.x, car.y);

        if (isSpinning) {
            ctx.rotate(spinAngle);
            ctx.globalAlpha = 0.5; // Set 50% transparency while spinning
        }

        let overrideColor = null;

        if (starPowerTimer > 0) {
            ctx.globalAlpha = 1; 
            // Solid, high-contrast color shifts applied directly to the body
            const starColors = ["#ff0055", "#00ffcc", "#ffff00", "#ff00ff", "#ffffff", "#0099ff"];
            overrideColor = starColors[Math.floor(frameCount / 2) % starColors.length];
        } else if (starWarningTimer > 0) {
            if (Math.floor(frameCount / 6) % 2 === 0) {
                ctx.globalAlpha = 0; // Flash hidden
            } else {
                const starColors = ["#ff0055", "#00ffcc", "#ffff00", "#ff00ff", "#ffffff", "#0099ff"];
                overrideColor = starColors[Math.floor(frameCount / 2) % starColors.length];
            }
        } else if (invulnerableTimer > 0 && Math.floor(frameCount / 4) % 2 === 0) {
            ctx.globalAlpha = 1;
        }

        drawPlayerCar(ctx, car.width, car.height, overrideColor);
        ctx.globalAlpha = 1.0; // Reset transparency back to 100%
        ctx.restore();
    }

    ctx.save();
    ctx.fillStyle = "rgba(15, 20, 30, 0.95)";
    ctx.fillRect(0, 0, canvas.width, roadTop - 20);
    ctx.restore();

    const heartWidth = 14;
    const heartHeight = 14;
    const spacingX = 16;
    const startX = 60;
    const row1Y = 20;
    const row2Y = 38;

    const topRowLives = Math.min(10, lives);
    const bottomRowLives = Math.max(0, lives - 10);

    for (let i = 0; i < topRowLives; i++) {
        drawHeart(ctx, startX + i * spacingX, row1Y, heartWidth, heartHeight);
    }
    for (let i = 0; i < bottomRowLives; i++) {
        drawHeart(ctx, startX + i * spacingX, row2Y, heartWidth, heartHeight);
    }

    ctx.save();
    ctx.fillStyle = "#00f0d0";
    ctx.font = "bold 16px 'Courier New'";
    ctx.textAlign = "left";
    ctx.fillText(`LVL:${currentLevel}`, startX, lives > 10 ? 66 : 54);
    ctx.restore();

    const statsTextX = 232;

    ctx.fillStyle = "#ffff80";
    ctx.font = "bold 12px 'Courier New'";
    ctx.textAlign = "left";
    ctx.fillText(`BEST:${bestDistance}m`, statsTextX, 24);

    ctx.fillStyle = "#ffffff";
    ctx.fillText(`DIST:${Math.floor(distanceTraveled)}m`, statsTextX, 42);

    ctx.fillStyle = "#05d9e8";
    ctx.fillText(`SPD:${Math.floor(displaySpeedMPH)} MPH`, statsTextX, 60);

    if (showOneUpTextTimer > 0 && earnedHeartPos) {
        ctx.save();
        const animOffset = (90 - showOneUpTextTimer) * 0.4;
        const popX = earnedHeartPos.x;
        const popY = earnedHeartPos.y - animOffset;

        drawHeart(ctx, popX - 12, popY - 12, 24, 24);
        ctx.restore();
    }

    drawPauseButton(ctx);
    drawInGameSettingsButton(ctx);
    drawVerticalCapsuleMinimap(ctx);

    if (gameState === "CRASH_SEQUENCE") {
        drawCrashSequence(ctx);
    }

    if (levelClearTimer > 0) {
        drawCelebrationSequence(ctx);
    }

    if (gameState === "START") {
        drawStartScreen();
    }

    if (gameState === "CAR_SELECT") {
        drawCarSelectScreen();
    }

    if (gameState === "GAMEOVER") {
        ctx.save();
        ctx.fillStyle = "rgba(9, 13, 22, 0.88)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "rgba(22, 30, 46, 0.9)";
        ctx.strokeStyle = "rgba(255, 61, 148, 0.4)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(30, 110, 340, 395, 16);
        ctx.fill();
        ctx.stroke();

        ctx.shadowColor = "#ff3d94";
        ctx.shadowBlur = 14;
        ctx.fillStyle = "#ff3d94";
        ctx.font = "bold 22px 'Courier New'";
        ctx.textAlign = "center";
        ctx.fillText(t("crashed"), 200, 155);

        ctx.shadowBlur = 0;
        ctx.fillStyle = "rgba(14, 20, 32, 0.75)";
        ctx.strokeStyle = "rgba(0, 210, 255, 0.25)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(50, 180, 300, 135, 12);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#80ffe5";
        ctx.font = "bold 10px 'Courier New'";
        ctx.fillText(t("runPerformance"), 200, 202);

        ctx.fillStyle = "#00f0d0";
        ctx.font = "bold 14px 'Courier New'";
        ctx.fillText(t("distance", { dist: Math.floor(distanceTraveled) }), 200, 234);

        ctx.fillStyle = "#ffe680";
        ctx.font = "bold 14px 'Courier New'";
        ctx.shadowColor = "#ffe680";
        ctx.shadowBlur = 6;
        ctx.fillText(t("bestDistance", { best: bestDistance }), 200, 272);
        ctx.shadowBlur = 0;

        ctx.restore();

        drawModernActionBtn(shareBtnBounds, t("shareScore"), "#00d2ff", "#80ffe5");
        drawModernActionBtn(tryAgainBtnBounds, t("tryAgain"), "#00f0d0", "#80ffeb");
        drawModernActionBtn(homeBtnBounds, t("home"), "#ff3d94", "#ff80b3");
    }

    if (gameState === "LEVEL_CLEAR") {
        ctx.save();
        ctx.fillStyle = "rgba(9, 13, 22, 0.88)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "rgba(22, 30, 46, 0.9)";
        ctx.strokeStyle = "rgba(0, 240, 208, 0.4)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(30, 140, 340, 310, 16);
        ctx.fill();
        ctx.stroke();

        ctx.shadowColor = "#00f0d0";
        ctx.shadowBlur = 14;
        ctx.fillStyle = "#00f0d0";
        ctx.font = "bold 20px 'Courier New'";
        ctx.textAlign = "center";
        ctx.fillText(t("stageCleared", { lvl: currentLevel }), 200, 190);

        ctx.shadowBlur = 0;
        ctx.fillStyle = "rgba(45, 18, 24, 0.85)";
        ctx.strokeStyle = "rgba(255, 77, 77, 0.8)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(50, 230, 300, 75, 12);
        ctx.fill();
        ctx.stroke();

        ctx.shadowColor = "#ff3333";
        ctx.shadowBlur = 8;
        ctx.fillStyle = "#ff5c5c";
        ctx.font = "bold 14px 'Courier New'";
        ctx.fillText(t("warning"), 200, 258);

        ctx.shadowBlur = 0;
        ctx.fillStyle = "#ffe680";
        ctx.font = "bold 11px 'Courier New'";
        ctx.fillText(t("nextFaster"), 200, 283);

        const pulse = Math.sin(Date.now() / 180) * 0.03 + 1;
        ctx.save();
        ctx.translate(200, 375);
        ctx.scale(pulse, pulse);

        ctx.shadowColor = "#00f0d0";
        ctx.shadowBlur = 12;

        const startNextGrad = ctx.createLinearGradient(0, -22, 0, 22);
        startNextGrad.addColorStop(0, "#00f0d0");
        startNextGrad.addColorStop(1, "#00a38d");
        ctx.fillStyle = startNextGrad;
        
        ctx.beginPath();
        ctx.roundRect(-130, -22, 260, 44, 10);
        ctx.fill();

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.fillStyle = "#0c140d";
        ctx.font = "bold 12px 'Courier New'";
        ctx.textBaseline = "middle";
        ctx.fillText(t("tapNext"), 0, 1);
        ctx.restore();
    }

    if (isSettingsOpen) {
        drawSettingsModal();
    }

    if (isLangModalOpen) {
        drawLanguageModal();
    }

    ctx.restore();
}

function gameLoop() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Globally disable all neon glow/shadows across the entire canvas
    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';
    update();
    
    if (gameState === "SPLASH") {
        render();
    } else {
        draw(); // Handles START, PLAYING, GAMEOVER, etc.
    }
    requestAnimationFrame(gameLoop);
}

updateFooterInstruction();
requestAnimationFrame(gameLoop);

</script>
